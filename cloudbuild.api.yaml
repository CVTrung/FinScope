# Build context is the repository root, not api/.
steps:
  - name: gcr.io/cloud-builders/docker
    args: ['build', '--target', 'api', '-f', 'Dockerfile', '-t', '${_IMAGE}', '.']
  - name: gcr.io/cloud-builders/docker
    args: ['push', '${_IMAGE}']
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args: ['run', 'deploy', '${_SERVICE_NAME}', '--image', '${_IMAGE}', '--region', '${_REGION}', '--port', '8080', '--memory', '1Gi', '--timeout', '120', '--allow-unauthenticated']
images: ['${_IMAGE}']
substitutions:
  _SERVICE_NAME: finscope-api
  _REGION: asia-southeast1
options:
  logging: CLOUD_LOGGING_ONLY
