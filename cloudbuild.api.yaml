# Optional split deployment only. Use cloudbuild.yaml for one service.
steps:
  - name: gcr.io/cloud-builders/docker
    args: ['build', '-f', 'api/Dockerfile', '-t', '${_IMAGE}', 'api']
  - name: gcr.io/cloud-builders/docker
    args: ['push', '${_IMAGE}']
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args: ['run', 'deploy', '${_SERVICE_NAME}', '--image', '${_IMAGE}', '--region', '${_REGION}', '--port', '8080', '--memory', '1Gi', '--timeout', '120', '--allow-unauthenticated', '--update-env-vars', 'ALLOWED_ORIGINS=https://finscope-443408251328.asia-southeast3.run.app']
images: ['${_IMAGE}']
substitutions:
  _SERVICE_NAME: finscope-web
  _REGION: asia-southeast3
  _IMAGE: asia-southeast3-docker.pkg.dev/finscope-510510/cloud-run-source-deploy/finscope-backend:$BUILD_ID
options:
  dynamicSubstitutions: true
  logging: CLOUD_LOGGING_ONLY
